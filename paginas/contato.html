<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Duda</title>
    <link rel="short icon" href="../imagens/favicon.ico">
    <link rel="stylesheet" type="text/css" href="../estilos/layout.css">
    <link rel="stylesheet" type="text/css" href="../estilos/formulario.css">
</head>
<body>
    <header>
        <figure>
            <img class="logo" src="../imagens/fotoPerfil.png"/>
        </figure>
        <h1>Eduarda Mary</h1>
    </header>
    <nav>
        <ul>
            <li><a href="../index.html">Página Principal</a></li>
            <li><a href="../paginas/sobre.html">Sobre</a></li>
            <li><a href="paginas/contato.html">Contatos</a></li>
        </ul>
    </nav>
    <main>
        <form id="formulario" action="respFormulario.html" method="post">
            <fieldset>
                <legend>Formulário de Contato</legend>
                <label for="lbNome">Nome:</label>
                <input id="ipNome" name="Nome" type="text" required>

                <label for="lbEmail">Email:</label>
                <input id="ipEmail" name="iEmail" type="Email" required>

                <label for="lbMensagem">Mensagem:</label>
                <textarea id="taMensagem" name="taMensagem" rows="5"></textarea>

                <label for="lbMotivo">Motivo do Contato</label>
                <select id="slMotivo" name="slMotivo">
                    <option value="suporte">Suporte</option>
                    <option value="vendas">Vendas</option>
                    <option value="servicos">Serviços</option>
                    <option value="fedback">Fedback</option>
                    <option value="outros">Outros</option>
                </select>
                <input type="submit" value="Enviar">
            </fieldset>
        </form>
    </main>
        <footer>
            <p>Rodapé da página</p>
            <p>Desenvolvido por Eduarda Mary &copy;2026</p>
        </footer>
</body>
</html>
